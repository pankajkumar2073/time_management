<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — TimeFlow Control Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #07090f 0%, #111827 50%, #1e1b4b 100%);
      color: #f8fafc;
      padding: 16px;
    }
    .login-card {
      width: 100%;
      max-width: 390px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 30px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #090d16;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }
    .toggle-pass {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .toggle-pass:hover {
      color: #e2e8f0;
    }
    .error-box {
      display: none;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      font-size: 12.5px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .submit-btn:hover {
      opacity: 0.94;
    }
    .submit-btn:active {
      transform: scale(0.99);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
    }
    .back-link:hover {
      color: #e2e8f0;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <span class="badge">Restricted Access</span>
    <h1>Admin Panel Login</h1>
    <p class="subtitle">Enter authorized mobile number and password to open Control Panel.</p>

    <div id="error-msg" class="error-box">Invalid Mobile Number or Password. Access denied.</div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter password" required />
          <button type="button" id="toggle-password" class="toggle-pass">Show</button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Login to Control Panel</button>
    </form>

    <a href="index.html" class="back-link">&larr; Back to Dashboard</a>
  </div>

  <script>
    const GOOGLE_DRIVE_API_URL = 'https://script.google.com/macros/s/AKfycbzUXVHBrVax7J-ZIjqvSY59anZvBK1AVrKH2SXWQbI7CmenR4z72I_enYqx6GKk-x2b/exec';
    const TOKEN_KEY = 'timeflow_admin_token_v1';

    if (sessionStorage.getItem(TOKEN_KEY)) {
      window.location.replace('item2.html');
    }

    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? 'Hide' : 'Show';
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const enteredMobile = document.getElementById('mobile').value.trim();
      const enteredPassword = document.getElementById('password').value;
      const errorBox = document.getElementById('error-msg');
      const submitBtn = this.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      errorBox.style.display = 'none';

      try {
        const res = await fetch(GOOGLE_DRIVE_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'adminLogin',
            mobile: enteredMobile,
            password: enteredPassword
          })
        });
        const result = await res.json();

        if (result.status === 'ok' && result.token) {
          sessionStorage.setItem(TOKEN_KEY, result.token);
          window.location.href = 'item2.html';
        } else {
          errorBox.style.display = 'block';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorBox.textContent = 'Network error verifying credentials.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login to Control Panel';
      }
    });
  </script>

</body>
</html>
